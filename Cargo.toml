[package]
name = "game_demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

authors = ["Michael Bishop <michael@bishopand.com>"]
description = "Bevy"
license = "MIT"

[dependencies]
bevy = "0.19.1"
avian3d = { version = "0.7.0", features = ["debug-plugin", "bevy_scene"] }
bevy_egui = "0.42.0"
bevy_svg = "0.19.0"
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23.45", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.3"

[profile.dev]
opt-level = 1              # a little faster without huge compile time
debug = true

[profile.release]
opt-level = "z"            # smaller binary; use 3 for max perf
lto = "thin"
