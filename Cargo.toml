[package]
name = "game_demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"

authors = ["Michael Bishop <michael@bishopand.com>"]
description = "Bevy"
license = "MIT"

[dependencies]
bevy = "0.20.1"
avian3d = { version = "0.8.0", features = ["debug-plugin", "bevy_scene"] }
bevy_egui = "0.43.1"
# The published release targets Bevy 0.19; pin the upstream Bevy 0.20 port.
bevy_svg = { git = "https://github.com/Weasy666/bevy_svg", rev = "d4a646e66aaefa1efc5e43a7a4d0b19281e3168e" }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23.46", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10.3"

[profile.dev]
opt-level = 1              # a little faster without huge compile time
debug = true

[profile.release]
opt-level = "z"            # smaller binary; use 3 for max perf
lto = "thin"
